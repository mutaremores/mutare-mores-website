name: Dependency audit

# Runs `npm audit` against the two real dependencies (gray-matter,
# markdown-it) weekly and whenever package.json/package-lock.json
# change, so dependency vulnerabilities get caught automatically
# instead of relying on someone remembering to check.
on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm audit --audit-level=moderate

      - name: Open an issue if vulnerabilities were found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Dependency vulnerabilities found (npm audit)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `npm audit found moderate-or-higher severity issues. See the run log: ${runUrl}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dependency-audit",
            });
            if (existing.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["dependency-audit"],
              });
            }
