backend:
  name: github
  repo: mutaremores/mutare-mores-website
  branch: main
  base_url: https://mutaremores.com
  auth_endpoint: .netlify/functions/auth

# Markdown files live at content/articles/*.md and get rebuilt into
# public/articles.json at build time by scripts/build-articles-json.mjs.
media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "article"
    label: "Learn Articles"
    folder: "content/articles"
    create: true
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: title
    view_groups:
      - { label: "Category", field: category }
      - { label: "Status", field: status }
    view_filters:
      - { label: "Not started", field: status, pattern: "Not started" }
      - { label: "In progress", field: status, pattern: "In progress" }
      - { label: "Done", field: status, pattern: "Done" }
      - { label: "Has been written up", field: hasContent, pattern: true }
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options: ["Concepts", "Notes", "Thoughts", "Types"]
      - label: "Topics"
        name: "topics"
        widget: "list"
        required: false
        default: []
      - label: "Sources"
        name: "sources"
        widget: "select"
        multiple: true
        required: false
        default: []
        options: ["Article", "Books", "Image", "Study", "Video", "Website"]
      - label: "Status"
        name: "status"
        widget: "select"
        required: true
        default: "Not started"
        options: ["Not started", "In progress", "Done"]
      - label: "First Published"
        name: "firstPublished"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: "Last Edited"
        name: "lastEdited"
        widget: "string"
        required: false
      - label: "Has been written up?"
        name: "hasContent"
        widget: "boolean"
        default: false
      - label: "Related Articles"
        name: "related"
        widget: "relation"
        collection: "article"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "{{slug}}"
        multiple: true
        required: false
        default: []
      - { label: "Original Index", name: "origIndex", widget: "hidden", required: false }
      - label: "TL;DR"
        name: "tldr"
        widget: "markdown"
        required: false
        minimal: true
      - label: "Notes (main article body)"
        name: "body"
        widget: "markdown"
        required: false
      - label: "Resources"
        name: "resources"
        widget: "markdown"
        required: false
        minimal: true

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "learn_welcome"
        label: "Learn: Start Here panel"
        file: "content/settings/learn-welcome.json"
        fields:
          - label: "Heading"
            name: "heading"
            widget: "string"
            default: "Start Here"
          - label: "Intro text"
            name: "intro"
            widget: "text"
            default: "This library grows out of real coaching notes and reading. Pick a way in, or browse everything."

      - name: "about"
        label: "About page"
        file: "content/settings/about.json"
        fields:
          - label: "Sections"
            name: "sections"
            widget: "list"
            label_singular: "Section"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "markdown" }

      - name: "work"
        label: "Work with me page"
        file: "content/settings/work.json"
        fields:
          - label: "What I Do"
            name: "whatIDo"
            widget: "markdown"
            hint: "The inline link back to the Learn page is a raw <a id=\"linkLearnFromWork\"> tag in the source text — leave it as-is unless you want to remove that link."
          - label: "The Discovery Call"
            name: "discoveryCall"
            widget: "markdown"
          - label: "Things We Can Work On — columns"
            name: "columns"
            widget: "list"
            label_singular: "Column"
            summary: "{{fields.title}}"
            fields:
              - { label: "Column title", name: "title", widget: "string" }
              - label: "Accordion items"
                name: "items"
                widget: "list"
                label_singular: "Item"
                summary: "{{fields.summary}}"
                fields:
                  - { label: "Summary (collapsed title)", name: "summary", widget: "string" }
                  - { label: "Body", name: "body", widget: "markdown" }
          - label: "Closing paragraph (after the two columns)"
            name: "workOnOutro"
            widget: "markdown"
          - label: "What It's Like To Work With Me — accordion"
            name: "faq"
            widget: "list"
            label_singular: "Item"
            summary: "{{fields.summary}}"
            fields:
              - { label: "Summary (collapsed title)", name: "summary", widget: "string" }
              - { label: "Body", name: "body", widget: "markdown" }
