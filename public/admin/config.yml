backend:
  name: github
  repo: mutaremores/mutare-mores-website
  branch: main
  base_url: https://mutaremores.com
  auth_endpoint: auth

# Markdown files live at content/articles/*.md and get rebuilt into
# public/articles.json at build time by scripts/build-articles-json.mjs.
media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "article"
    label: "Learn Articles"
    folder: "content/articles"
    create: true
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: title
    # The editor form itself is styled to look like the real article card
    # (see article-editor.js/.css), so the default split preview pane would
    # just be a redundant second copy — turned off here.
    editor:
      preview: false
    view_groups:
      - { label: "Category", field: category }
      - { label: "Status", field: status }
    view_filters:
      - { label: "Not started", field: status, pattern: "Not started" }
      - { label: "In progress", field: status, pattern: "In progress" }
      - { label: "Done", field: status, pattern: "Done" }
    fields:
      - { label: "Title", name: "title", widget: "article-title", required: true }
      # Status/Category/Sources/Topics are grouped here (rather than
      # interleaved with the date/relation fields below) so
      # article-editor.css can lay them out as one Notion-style property
      # row instead of Decap's default stacked form.
      - label: "Status"
        name: "status"
        widget: "article-status"
        required: true
        default: "Not started"
        options: ["Not started", "In progress", "Done"]
      - label: "Category"
        name: "category"
        widget: "article-category"
        required: false
        options: ["Concepts", "Notes", "Thoughts", "Types"]
      - label: "Sources"
        name: "sources"
        widget: "select"
        multiple: true
        required: false
        default: []
        options: ["Article", "Books", "Image", "Study", "Video", "Website"]
      - label: "Topics"
        name: "topics"
        widget: "select"
        multiple: true
        required: false
        default: []
        options: ["Adaptability", "Coaching", "Communication", "Creativity", "Culture", "EQ", "Execution", "Influence", "Leadership", "Learning", "Organizational development", "Personal development", "Personality", "Philosophy", "Procrastination", "Productivity", "Psychology", "Systems design", "Systems thinking", "Task management", "Team dynamics", "Time management", "Training", "Vision"]
      - label: "First Published"
        name: "firstPublished"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: "Last Edited"
        name: "lastEdited"
        widget: "string"
        required: false
      - { label: "Original Index", name: "origIndex", widget: "hidden", required: false }
      - label: "TL;DR"
        name: "tldr"
        widget: "block-editor"
        required: false
      - label: "Notes (main article body)"
        name: "body"
        widget: "block-editor"
        required: false
      - label: "Resources"
        name: "resources"
        widget: "block-editor"
        required: false

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "learn_welcome"
        label: "Learn: Start Here panel"
        file: "content/settings/learn-welcome.json"
        fields:
          - label: "Heading"
            name: "heading"
            widget: "string"
            default: "Start Here"
          - label: "Intro text"
            name: "intro"
            widget: "text"
            default: "This library grows out of real coaching notes and reading. Pick a way in, or browse everything."

      # Feeds the single "Your Discovery Assessment Results" page shown
      # after completing the Discovery Test (public/index.html's
      # insertResultsColumn) -- one What it means / Strengths /
      # Considerations bullet list per dimension per High/Low reading,
      # instead of 12 separate articles.
      #
      # Deliberately flat (36 top-level list fields, name = dimension +
      # level + category, e.g. "creativityHighStrengths") rather than
      # nested object widgets (dimension > level > category) -- the nested
      # version rendered fine but silently failed to load ANY existing
      # data for the whole "Site Settings" files collection (not just this
      # entry), consistently reproduced across removing YAML anchors and
      # confirmed by temporarily deleting this block entirely and watching
      # the About/Work entries recover. Flat list widgets are the one
      # pattern already proven reliable elsewhere in this file (Sources,
      # the original Topics). scripts/build-articles-json.mjs reassembles
      # these back into the nested shape public/index.html expects.
      - name: "discovery_results"
        label: "Discovery Assessment Results page"
        file: "content/settings/discovery-results.json"
        fields:
          - { label: "Creativity — High — What it means", name: "creativityHighWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Creativity — High — Strengths", name: "creativityHighStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Creativity — High — Considerations", name: "creativityHighConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Creativity — Low — What it means", name: "creativityLowWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Creativity — Low — Strengths", name: "creativityLowStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Creativity — Low — Considerations", name: "creativityLowConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "EQ — High — What it means", name: "eqHighWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "EQ — High — Strengths", name: "eqHighStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "EQ — High — Considerations", name: "eqHighConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "EQ — Low — What it means", name: "eqLowWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "EQ — Low — Strengths", name: "eqLowStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "EQ — Low — Considerations", name: "eqLowConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Vision — High — What it means", name: "visionHighWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Vision — High — Strengths", name: "visionHighStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Vision — High — Considerations", name: "visionHighConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Vision — Low — What it means", name: "visionLowWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Vision — Low — Strengths", name: "visionLowStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Vision — Low — Considerations", name: "visionLowConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Influence — High — What it means", name: "influenceHighWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Influence — High — Strengths", name: "influenceHighStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Influence — High — Considerations", name: "influenceHighConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Influence — Low — What it means", name: "influenceLowWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Influence — Low — Strengths", name: "influenceLowStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Influence — Low — Considerations", name: "influenceLowConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Execution — High — What it means", name: "executionHighWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Execution — High — Strengths", name: "executionHighStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Execution — High — Considerations", name: "executionHighConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Execution — Low — What it means", name: "executionLowWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Execution — Low — Strengths", name: "executionLowStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Execution — Low — Considerations", name: "executionLowConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Adaptability — High — What it means", name: "adaptabilityHighWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Adaptability — High — Strengths", name: "adaptabilityHighStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Adaptability — High — Considerations", name: "adaptabilityHighConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Adaptability — Low — What it means", name: "adaptabilityLowWhatItMeans", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Adaptability — Low — Strengths", name: "adaptabilityLowStrengths", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }
          - { label: "Adaptability — Low — Considerations", name: "adaptabilityLowConsiderations", widget: "list", field: { label: "Bullet", name: "bullet", widget: "string" } }

      - name: "about"
        label: "About page"
        file: "content/settings/about.json"
        fields:
          - label: "Sections"
            name: "sections"
            widget: "list"
            label_singular: "Section"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "markdown" }

      - name: "work"
        label: "Work with me page"
        file: "content/settings/work.json"
        fields:
          - label: "What I Do"
            name: "whatIDo"
            widget: "markdown"
            hint: "The inline link back to the Learn page is a raw <a id=\"linkLearnFromWork\"> tag in the source text — leave it as-is unless you want to remove that link."
          - label: "The Discovery Call"
            name: "discoveryCall"
            widget: "markdown"
          - label: "Things We Can Work On — columns"
            name: "columns"
            widget: "list"
            label_singular: "Column"
            summary: "{{fields.title}}"
            fields:
              - { label: "Column title", name: "title", widget: "string" }
              - label: "Accordion items"
                name: "items"
                widget: "list"
                label_singular: "Item"
                summary: "{{fields.summary}}"
                fields:
                  - { label: "Summary (collapsed title)", name: "summary", widget: "string" }
                  - { label: "Body", name: "body", widget: "markdown" }
          - label: "Closing paragraph (after the two columns)"
            name: "workOnOutro"
            widget: "markdown"
          - label: "What It's Like To Work With Me — accordion"
            name: "faq"
            widget: "list"
            label_singular: "Item"
            summary: "{{fields.summary}}"
            fields:
              - { label: "Summary (collapsed title)", name: "summary", widget: "string" }
              - { label: "Body", name: "body", widget: "markdown" }
