<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager — Mutare Mores</title>
    <!-- Real site fonts, for the inline title/status/category widgets in
         article-editor.js/.css that render as the actual site markup
         directly in the admin form (not inside an isolated preview iframe,
         so these need to be loaded here too). Same URL preview.js already
         uses for its iframe previews. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- ?v= is a manual cache-buster, not a build hash (no build step
         transforms this file) -- Cloudflare serves these two files with
         long-lived cache headers by default since their filenames never
         change, so without this every deploy would keep serving stale JS/
         CSS to anyone who already has the admin open until they hard-
         refresh. Bump the number whenever article-editor.css/.js change. -->
    <link rel="stylesheet" href="article-editor.css?v=2">
  </head>
  <body>
    <div id="nc-root"></div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Same markdown-it version/config scripts/build-articles-json.mjs uses
         server-side, loaded here so the live preview (preview.js) renders
         markdown fields identically to how the real build does. -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.3.0/dist/markdown-it.min.js"></script>
    <!-- Block editor (Notion-style: headings, lists, drag-to-reorder) used
         in place of the default markdown textarea — see article-editor.js.
         Exact CDN paths/global names below were verified live before use,
         since several of the "obvious" guesses (e.g. list.umd.js,
         EditorjsDragDrop) turned out to be wrong. -->
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@2/dist/editorjs.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2/dist/header.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/list@2/dist/editorjs-list.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/editorjs-drag-drop@1/dist/bundle.js"></script>
    <script src="article-editor.js?v=2"></script>
    <!-- Registers preview templates so the editor's preview pane shows an
         accurate rendering of the real site (see preview.js) instead of
         Decap's generic default preview. Must load after decap-cms.js and
         markdown-it. -->
    <script src="preview.js"></script>
  </body>
</html>
