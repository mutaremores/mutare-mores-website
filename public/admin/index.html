<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager — Mutare Mores</title>
    <style>
      /* Small persistent bar above the CMS app. Decap CMS only mounts into
         #nc-root (see https://decapcms.org/docs/custom-mounting/) — anything
         outside that div is ours and stays put across every CMS screen. */
      .cms-topbar{
        display:flex;align-items:center;justify-content:flex-end;gap:16px;
        padding:8px 16px;font-family:Helvetica,Arial,sans-serif;font-size:13px;
        background:#1e2532;color:#fff;
      }
      .cms-topbar a{color:#fff;text-decoration:underline;text-underline-offset:2px;}
    </style>
  </head>
  <body>
    <div class="cms-topbar">
      <a href="browse.html">Browse &amp; edit articles →</a>
    </div>
    <div id="nc-root"></div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Same markdown-it version/config scripts/build-articles-json.mjs uses
         server-side, loaded here so the live preview (preview.js) renders
         markdown fields identically to how the real build does. -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.3.0/dist/markdown-it.min.js"></script>
    <!-- Registers preview templates so the editor's preview pane shows an
         accurate rendering of the real site (see preview.js) instead of
         Decap's generic default preview. Must load after decap-cms.js and
         markdown-it. -->
    <script src="preview.js"></script>
  </body>
</html>
